<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yushu Liu</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
  :root{
    --bg:#10151B; --ink:#EDE7DA; --faint:#7E8894;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Source Serif 4",Georgia,serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:2rem; text-align:center;
  }
  h1{
    font-size:clamp(1.9rem,6vw,3rem); font-weight:600;
    letter-spacing:.06em; line-height:1.3;
  }
  .dot{
    display:block; width:5px; height:5px; border-radius:50%;
    background:var(--faint); margin:1.6rem auto 0;
  }
</style>
</head>
<body>
  <div>
    <h1>Yushu Liu</h1>
    <span class="dot" aria-hidden="true"></span>
  </div>
<script data-goatcounter="https://rainjin.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
